[project]
name = "monotonic-wall-time-adapter"
version = "0.1.0"
description = "Provides a single clock function returning a monotonic float with a stable epoch, hiding the difference between time.monotonic and perf_counter."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
